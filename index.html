<html>
    <body>
        <a style="font-size: 10; color:grey;">Original Robot 64 Mods by EmK530 - Website by Azzy</a>
        <div class="topbar">
            <a class="title">Robot 64 Mods</a>
            <button class="topbar_button" id="main">Main</button>
            <button class="topbar_button" id="kaizo">Kaizo</button>
            <button class="topbar_button" id="modzones">Modzones</button>
            <button class="topbar_button" id="other">Other</button>
            <button class="topbar_button" id="unreleased" style="color: rgb(255, 241, 47)">Unreleased</button>
            <button class="topbar_button" id="all">All mods</button>
        </div>
        <div id="mainModPage" class="mainmods">
            <div class="mod_preview" id="modPreviewTemplate">
                <a class="mod_name" id="modName"></a>
                <a id="modCreator" class="mod_maker_username"></a>
                <div id="modImage" class="mod_image"></div>
                <a id="modRating" class="mod_rating"></a>
                <div id="bottom" class="mod_bottom_container">
                    <a id="briefDescription" class="mod_small_desc"></a>
                    <button id="playButton" class="play_button">
                        <a id="playButtonLink" class="play_button_text">Play this mod</a>
                    </button>
                </div>
            </div>
        </div>
    </body>
    <style>
        body {
            display:flex;
            gap: 10px;
            background-color: rgb(31, 30, 36);
            align-items: center;
            flex-direction: column;
        }
        .mod_rating {
            color: greenyellow
        }
        .topbar {
            border-radius: 3px;
            background-color: rgba(0, 0, 0, 0);
            width: 800px;
            display: flex;
            gap: 10px;
            flex-direction: row;
            align-items: center;
            flex-wrap: nowrap;
            justify-content: center;
            height: fit-content;
        }
        .mainmods {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            border-radius: 3px;
            padding: 0;
            background-color: rgba(0, 0, 0, 0);
            width: 800px;
            margin: 0;
            height: 100%;
        }
        .mod_preview {
            background-color: rgba(0, 0, 0, 0.353);
            width: 300px;
            padding: 5px;
            gap: 5px;
            border-radius: 6px;
            display: none;
            flex-direction: column;
            height: 230px;
            align-items: center;
        }
        .newmodoutline {
            border-style: solid;
            border-width: 2px;
            border-color: greenyellow;
        }
        .mod_maker_username {
            font-size: 12px;
            color: rgb(112, 141, 211);
        }
        .play_button_text {
            color: rgba(0,0,0,0);
            width: 100%;
            height: 100%;
        }
        .topbar_button {
            background-color: rgba(255, 255, 255, 0) ;
            border-style: solid;
            border-width: 2px;
            border-radius: 16px;
            height: 30px;
            font-size: 18;
            border-color: rgba(255, 255, 255, 0.34);
            width: fit-content;
            color: rgba(211, 211, 211, 0.9);
            transition: all 0.5s;
        }
        .topbar_button:hover {
            border-style: solid;
            border-color: rgb(60, 255, 0);
            color: rgb(255, 255, 255)
        }
        a {
            color: white;
        }
        .mod_bottom_container {
            width: 100%;
            display: flex;
        }
        .mod_small_desc {
            margin-top: 5px;
            color: rgb(189, 189, 189);
            margin-left: 5px;
            width: 200px;
        }
        .mod_image {
            background-repeat: no-repeat;
            background-size: 100% 100%;
            height: 86px;
            width: 200px;
        }
        .play_button {
            background-image: url(PlayButton.png);
            color: rgba(0,0,0,0);
            background-size: 100% 100%;
            border-width: 0;
            width: 40%;
            margin-top: 7px;
            border-radius: 4px;
            height: 30px;
        }
        .title {
            padding: 5px;
            font-size: 12px;
            width: 70px;
            color: rgba(221, 221, 221, 0);
            background-image: url(Logo.png);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        * {
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
    </style>
    <script>
        const mod_preview_template = document.getElementById("modPreviewTemplate")
        const mod_display = document.getElementById("mainModPage")
        let can_play_music = true
        let music = new Audio("Music.mp3")
        music.loop = true
        function clearModPage() {
            mod_display.innerHTML = ""
        }
        function loadMods(cat) {
            clearModPage()
            if (can_play_music) {
                can_play_music = false
                music.play()
            }
            fetch(`${cat}.json`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`err - stat: ${response.status}`)
                }
                return response.json()
            })
            .then(data => {
                data.mods.forEach(element => {
                    let cloned = mod_preview_template.cloneNode(true)
                    let modCreator = cloned.getElementsByClassName("mod_maker_username")[0]
                    let modName = cloned.getElementsByClassName("mod_name")[0]
                    let modBriefDescription = cloned.getElementsByClassName("mod_small_desc")[0]
                    let modImage = cloned.getElementsByClassName("mod_image")[0]
                    let modRating = cloned.getElementsByClassName("mod_rating")[0]
                    let playButton = cloned.getElementsByClassName("play_button_text")[0]
                    let parent = cloned.parentElement
                    mod_display.appendChild(cloned)
                    playButton.href = "https://www.roblox.com/games/"+element.placeId
                    modImage.style.backgroundImage = element.thumbnail.value
                    modName.textContent = element.name
                    modBriefDescription.textContent = element.description.brief
                    modRating.textContent = "Rating: "+Math.round(element.rating)+"%"
                    modImage.style.backgroundImage = "url(Placeholder.jpg)";
                    if (element.creator.isGroup === false) {
                        modCreator.href = "https://roblox.com/users/"+element.creator.id
                        modCreator.textContent = "Creator's profile"
                    } else {
                        modCreator.textContent = "Group link"
                        modCreator.href = "https://www.roblox.com/communities/"+element.creator.id
                    }
                    cloned.style.display = "flex"
                });
            })
        }
        loadMods("Main")
        document.getElementById("main").onclick = function () {
            loadMods("Main")
        }
        document.getElementById("kaizo").onclick = function () {
            loadMods("Kaizo")
        }
        document.getElementById("modzones").onclick = function () {
            loadMods("Modzones")
        }
        document.getElementById("other").onclick = function () {
            loadMods("Other")
        }
        document.getElementById("unreleased").onclick = function () {
            loadMods("Unreleased")
        }
        document.getElementById("all").onclick = function () {
            loadMods("All")
        }
    </script>
</html>
